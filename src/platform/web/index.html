<!DOCTYPE html>
<!--
  KisakBlack — WebGL2/WASM boot harness.

  Flow: the page loads web_fs.js (the File System Access bridge), then the user
  clicks "Pick Steam folder" to grant the local "Call of Duty Black Ops" install.
  Only after a folder is granted (or the fake-file smoke FS is enabled) is the
  wasm started, so the engine's first synchronous file reads find data.

  Two builds share this harness:
   * Single-threaded + Asyncify (build_web/link_web): does NOT require COOP/COEP;
     serve with any static server (python3 -m http.server).
   * Multithreaded + pthreads (build_web_mt/link_web_mt): REQUIRES cross-origin
     isolation (COOP: same-origin, COEP: require-corp) + a secure context for
     SharedArrayBuffer. Serve with serve_web_mt.py (over HTTPS on a LAN). The render
     backend runs on its own Web Worker and owns the WebGL2 context (proxied to this
     canvas); main() runs on a proxied worker. The <canvas id="canvas"> below stays on
     this DOM thread — the worker's GL context targets "#canvas" and proxies to it.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KisakBlack (WebGL2)</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; }
  #bar { padding: 8px 12px; background: #1c1c1c; display: flex; gap: 12px; align-items: center; }
  #bar button { padding: 6px 14px; cursor: pointer; }
  #status { font-size: 13px; color: #9c9; }
  #canvas { display: block; width: 100vw; height: calc(100vh - 44px); background: #000; }
  canvas.emscripten { outline: none; }
</style>
</head>
<body>
  <!-- On-page error console: surfaces startup failures (e.g. an OffscreenCanvas/de-proxy
       black-screen) as visible red text to screenshot, even when the dev console is closed. -->
  <div id="kberr" style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#600;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:45%;overflow:auto;padding:6px;display:none"></div>
  <script>
    (function(){
      var box=document.getElementById('kberr');
      window.__kbShowErr=function(m){ try{ box.style.display='block'; box.textContent+=String(m)+"\n"; }catch(e){} };
      window.addEventListener('error',function(e){ window.__kbShowErr('[error] '+(e.message||e.error||e)+(e.filename?(' @'+e.filename+':'+e.lineno):'')); });
      window.addEventListener('unhandledrejection',function(e){ window.__kbShowErr('[reject] '+((e.reason&&e.reason.message)||e.reason||e)); });
    })();
  </script>
  <div id="bar">
    <button id="pick">Pick Steam "Call of Duty Black Ops" folder</button>
    <label><input type="checkbox" id="fake" /> fake-file smoke test (no data)</label>
    <span id="status">waiting for a data folder…</span>
  </div>
  <div style="position:relative">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <!-- De-proxy GL target: a hidden canvas NOTHING else touches. Extensions/recorders
         grab the visible #canvas (captureStream) which then can never be transferred
         offscreen ("Cannot transfer OffscreenCanvas bound to element using captureStream").
         The engine transfers THIS one to the render worker instead; frames still reach
         the user via the #display overlay present path, and input stays on #canvas. -->
    <!-- VISIBLE (2x2, near-transparent, in-viewport): Chrome discards the GPU context
         of never-composited canvases first under memory pressure — a display:none
         placeholder made the worker's context the designated victim at map load
         (half-dead channel: client-side queries fine, every GPU round-trip nulls). -->
    <canvas id="kbgl" width="2" height="2"
            style="position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:0.01;pointer-events:none"></canvas>
    <!-- DE-PROXY display overlay: when the render worker owns the canvas as an
         OffscreenCanvas (KB_DEPROXY build), implicit frame propagation never happens
         (the render thread never yields its event loop), so the worker posts each frame
         as an ImageBitmap and we draw it here. pointer-events:none keeps mouse input
         landing on #canvas. Idle/transparent on the stock proxied build. -->
    <canvas id="display" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></canvas>
  </div>

  <!-- DE-PROXY frame interception: wrap Worker so we see every pthread worker the
       runtime spawns and catch the render worker's {kbFrame: ImageBitmap} posts.
       addEventListener at construction is ordered BEFORE Emscripten's later .onmessage
       assignment, and stopImmediatePropagation() keeps kbFrame messages out of the
       pthread message dispatcher. MUST run before blackops.js loads. -->
  <script>
    (function () {
      var dctx = null, disp = null, kbRecv = 0;
      function kbPresent(bmp, ackPtr) {
        try {
          if (!dctx) { disp = document.getElementById('display'); dctx = disp.getContext('bitmaprenderer'); }
          if (disp.width !== bmp.width || disp.height !== bmp.height) { disp.width = bmp.width; disp.height = bmp.height; }
          dctx.transferFromImageBitmap(bmp);
          // Confirm the PAGE actually receives + draws frames (vs the worker thinking it
          // posted). First frame + every 120th: if these print but the screen is black,
          // the issue is the #display overlay/CSS, not the present hand-off.
          if ((kbRecv++ % 120) === 0)
            console.log('[kbpresent] page drew frame #' + kbRecv + ' (' + bmp.width + 'x' + bmp.height +
                        ', #display ' + disp.width + 'x' + disp.height + ')');
        } catch (e) {
          try { bmp.close(); } catch (_) {}
          // A silently-failing present = permanent black while the engine keeps
          // running. Be loud and self-heal: drop the cached context so the next
          // frame recreates it.
          if (!window.__kbPresErr) { window.__kbPresErr = 1; console.error('[kbpresent] present failed (will retry): ', e); }
          dctx = null;
        }
        // Backpressure ack: the worker drops frames (no new ImageBitmap) until this flag
        // clears — unconsumed bitmaps piling up OOMed the GPU process (empty-log shader
        // compile failures + tab crashes). HEAP32 is the shared wasm heap.
        try { if (ackPtr && window.Module && Module.HEAP32) Atomics.store(Module.HEAP32, ackPtr >> 2, 0); } catch (e) {}
      }
      var RealWorker = window.Worker;
      window.Worker = function (url, opts) {
        var w = new RealWorker(url, opts);
        w.addEventListener('message', function (e) {
          if (e.data && e.data.kbFrame) { e.stopImmediatePropagation(); kbPresent(e.data.kbFrame, e.data.kbAck); }
        });
        return w;
      };
      window.Worker.prototype = RealWorker.prototype;
    })();
  </script>

  <!-- Emscripten Module config MUST exist before blackops.js loads. -->
  <script>
    window.Module = {
      canvas: (function () { return document.getElementById('canvas'); })(),
      arguments: ['+devmap','mp_nuked'],   // engine cmdline; edit the map or add +set dvar value
      noInitialRun: true,            // we call run() ourselves after data is ready
      print:    (t) => console.log(t),
      printErr: (t) => { console.warn(t); try { if (/error|abort|exception|fail|fatal|GL_INVALID|context/i.test(t)) window.__kbShowErr && window.__kbShowErr(t); } catch(e){} },
      onAbort:  (w) => { try { window.__kbShowErr && window.__kbShowErr('[abort] ' + w); } catch(e){} },
      setStatus: (t) => { if (t) document.getElementById('status').textContent = t; },
      // NOTE: Emscripten's default $HOME is already '/home/web_user' (see getEnvStrings),
      // so getenv("HOME") is non-empty and SHGetFolderPathA() resolves the engine's
      // "user documents" base to /home/web_user/Activision/CoD — never /tmp.
      // preRun: create every writable path the engine touches at boot in MEMFS so a
      // config/log/screenshot write never throws ErrnoError 44 (ENOENT). Game-asset
      // READS still go through the File System Access bridge (KBFS); these MEMFS dirs
      // only back the engine's WRITES (console_mp.log, players/, config). FS is on the
      // EXPORTED_RUNTIME_METHODS list, so it's available here in preRun.
      preRun: [function () {
        // Perf toggles: ?batch=1 / ?coalesce=1 on the page URL reach the GL layer via
        // ENV (forwarded to pthreads). Defaults are OFF while a post-B45 crash is isolated.
        try {
          var q = new URLSearchParams(location.search);
          if (q.get('batch') === '0')    ENV.KB_BATCH = '0';     // default ON
          if (q.get('coalesce') === '0') ENV.KB_COALESCE = '0';  // default ON
          if (q.get('shadows') === '1')  ENV.KB_SHADOWS = '1';
          if (q.get('shadows') === '0')  ENV.KB_SHADOWS = '0';
          if (q.get('noocc') === '1')    Module.arguments.push('+set', 'r_enableOccluders', '0');
          if (q.get('dumpenv') === '1')  ENV.KB_DUMPENV = '1';
          if (q.get('noportal') === '1') Module.arguments.push('+set', 'r_kbNoPortal', '1');
          // ?noprepass=1: skip the depth pre-pass. It re-draws all opaque geometry to
          // depth before the color pass — a native-GPU overdraw optimization that just
          // ~doubles the (expensive) draw-call count on the web build, which is
          // draw-call-bound not shading-bound. Trades overdraw (free on a real GPU) for
          // far fewer GL calls. May affect some alpha-test geometry (trees).
          if (q.get('noprepass') === '1' || q.get('nopreprass') === '1' || q.get('noprepas') === '1') {
            Module.arguments.push('+set', 'r_depthPrepass', '0');
            ENV.KB_NOPREPASS = '1';   // GL layer remaps lit-pass EQUAL depth test -> LEQUAL
          }
          // ?lowdetail=1: cut FRONTEND scene-processing cost (the proven bottleneck — GL
          // batching gave ~0 fps, so the limiter is the engine producing the scene, not
          // drawing it). r_worldLod default 0 *forces world geometry to highest detail*;
          // setting it 1 enables distance LOD so the ~2800 distant world surfaces in dense
          // scenes process/upload less. r_lodScale* >1 reduces model detail at distance.
          if (q.get('lowdetail') === '1') {
            Module.arguments.push('+set', 'r_worldLod', '1');
            Module.arguments.push('+set', 'r_lodScaleRigid', '4');
            Module.arguments.push('+set', 'r_lodScaleSkinned', '4');
            Module.arguments.push('+set', 'r_lodBiasRigid', '2');
            Module.arguments.push('+set', 'r_lodBiasSkinned', '2');
          }
          // ?nofloatz=1: skip the Float-Z depth pre-pass (a 2nd full geometry pass the GL
          // shim always runs because supportsIntZ=0 — NOT gated by r_depthPrepass). Big draw
          // cut; may glitch depth-based effects (soft particles/fog/DOF). No black screen.
          if (q.get('nofloatz') === '1') ENV.KB_NOFLOATZ = '1';
          // DOF (the ADS blur) is broken on the GL post-FX path — its multi-pass downsample/blur/
          // depth-combine renders garbage (upside-down sliver + smeared single color), making ADS
          // unusable. DEFAULT IT OFF so ADS is a clean zoom; ?dof=1 re-enables it (to test a future
          // GL DOF fix). ?nodof=1 also accepted for explicitness.
          if (q.get('dof') !== '1' || q.get('nodof') === '1')
            Module.arguments.push('+set', 'r_dof_enable', '0');
          // ?nodistort=1: disable the distortion/refraction pass (scope/heat-haze full-screen warp).
          if (q.get('nodistort') === '1') Module.arguments.push('+set', 'r_distortion', '0');
          // ?nogpusync=1: r_gpuSync off. Default ("adaptive") spin-waits on a GPU fence at the END
          // of every frame (R_FinishGpuFence) — on the proxied build each poll is a glClientWaitSync
          // round-trip to the DOM thread, and the wait SERIALIZES backend command production with
          // the DOM thread draining + GPU finishing this frame. Off lets them overlap (it's a mouse-
          // latency tweak, not correctness). Watch for hitches at spawn (CPU outrunning the GPU).
          // r_gpuSync DEFAULT OFF on web (measured faster; the per-frame fence spin serializes the
          // backend with the DOM/GPU drain — a native latency tweak that's a net loss proxied).
          // ?gpusync=1 restores adaptive sync if spawn-time command-queue flooding ever shows up.
          if (q.get('gpusync') !== '1') Module.arguments.push('+set', 'r_gpuSync', '0');
          if (q.get('perfms') === '1')   ENV.KB_PERFMS = '1';    // [perf/ms] frame split
          if (q.get('nosnd') === '1')    ENV.KB_NOSND = '1';     // headless: no audio device
          if (q.get('mips') === '1')     ENV.KB_MIPS = '1';      // re-enable cube GenerateMipmap (wedges ANGLE-GL)
          if (q.get('novao') === '1')    ENV.KB_NOVAO = '1';     // bypass VAO cache (bisect)
          if (q.get('dumpskin') === '1') ENV.KB_DUMPSKIN = '1';  // [kbskin] dump skinned vertex decls (M16 spazz)
          if (q.get('drawcomp') === '1') ENV.KB_DRAWCOMP = '1';  // [perf/comp] instanceable-vs-unique draw histogram
          // GPU instancing of consecutive same-geometry draws (one glDrawElementsInstanced per
          // run; matrix via instanced attributes). DEFAULT ON (=2, measured ~+33% dense, clean,
          // reorders nothing). ?inst=1 = validate (per-instance normal render); ?noinst / ?inst=0
          // = off (fallback if any prop misplacement ever shows up).
          { var iv = q.get('inst'); if (q.get('noinst') === '1') iv = '0';
            ENV.KB_INST = (iv === '0' || iv === '1' || iv === '2') ? iv : '2'; }
          var rm = q.get('rmode');                               // ?rmode=640x480
          if (rm && /^\d+x\d+$/.test(rm)) Module.arguments.push('+set', 'r_mode', rm);
        } catch (e) {}
        try {
          var mk = (p) => { try { FS.mkdirTree(p); } catch (e) {} };
          mk('/tmp');                       // (runtime already makes it; harmless)
          mk('/home/web_user');             // $HOME (userDocuments base)
          mk('/home/web_user/Activision/CoD');   // FS_GetOsFolderPath(CSIDL_*) target
          mk('/main');                      // fs_homepath=/ + gamedir "main" (logs/config)
          mk('/players');                   // FS_FOpenFileWriteToDir(..,"players",..)
          mk('/screenshots');               // screenshot writes
        } catch (e) { console.warn('[KBFS] preRun mkdir failed', e); }
      }],
    };
  </script>

  <!--
    Deadlock-free input bridge for the MT build. The engine's render worker proxies
    every GL call to this DOM thread, so the game worker must NOT make synchronous DOM
    calls (registering listeners from the worker deadlocks). Instead these listeners run
    natively here on the DOM thread and write input into a shared int32 block in WASM
    memory (a SharedArrayBuffer); the game worker only reads it. The C side calls
    KBInputSetup(base, fbW, fbH) once (via MAIN_THREAD_ASYNC_EM_ASM). Layout / packing
    must match src/platform/sdl/sdl_events.cpp (KBI_* and the ring-entry encoding).
  -->
  <script>
    window.KBInputSetup = function (base, fbW, fbH) {
      const KBI_MX = 0, KBI_MY = 1, KBI_DX = 2, KBI_DY = 3, KBI_HEAD = 4;
      const KBI_RING = 8, KBI_RINGSZ = 256;
      // base is a byte offset; the shared buffer is not detached on growth (pthreads),
      // and the block lives in fixed low static data, so this view stays valid.
      const V = new Int32Array(Module.HEAPU8.buffer, base, KBI_RING + KBI_RINGSZ);
      const canvas = document.getElementById('canvas');

      function push(kind, down, value) {
        const h = Atomics.load(V, KBI_HEAD);
        V[KBI_RING + (h & (KBI_RINGSZ - 1))] =
          ((kind & 0xFF) << 24) | ((down & 1) << 16) | (value & 0xFFFF);
        Atomics.store(V, KBI_HEAD, h + 1);   // publish (release) the entry above
      }
      function setPos(e) {
        const r = canvas.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          Atomics.store(V, KBI_MX, ((e.clientX - r.left) * fbW / r.width) | 0);
          Atomics.store(V, KBI_MY, ((e.clientY - r.top) * fbH / r.height) | 0);
        }
      }
      // Stop scroll/tab-navigation for keys the game consumes; leave Ctrl/Cmd/Alt and
      // F-keys (reload/devtools) alone for the developer.
      function maybePD(e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const kc = e.keyCode;
        if (kc === 9 || kc === 32 || (kc >= 33 && kc <= 40)) e.preventDefault();
      }

      window.addEventListener('keydown', function (e) {
        push(0 /*KEY*/, 1, e.keyCode);
        if (e.key && e.key.length === 1) {
          const c = e.key.charCodeAt(0);
          if (c >= 0x20 && c < 0x7F) push(1 /*CHAR*/, 0, c);
        }
        maybePD(e);
      });
      window.addEventListener('keyup', function (e) { push(0 /*KEY*/, 0, e.keyCode); maybePD(e); });
      canvas.addEventListener('mousemove', function (e) {
        setPos(e);
        Atomics.add(V, KBI_DX, e.movementX | 0);
        Atomics.add(V, KBI_DY, e.movementY | 0);
      });
      canvas.addEventListener('mousedown', function (e) { setPos(e); push(2 /*MBTN*/, 1, e.button); e.preventDefault(); });
      canvas.addEventListener('mouseup',   function (e) { setPos(e); push(2 /*MBTN*/, 0, e.button); e.preventDefault(); });
      canvas.addEventListener('wheel',      function (e) { push(3 /*WHEEL*/, e.deltaY < 0 ? 1 : 0, 0); e.preventDefault(); }, { passive: false });
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      console.log('[KBInput] listeners wired (' + fbW + 'x' + fbH + ')');
    };
  </script>

  <script src="web_fs.js"></script>
  <script src="blackops.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    function setStatus(t) { statusEl.textContent = t; }

    function startEngine() {
      setStatus("starting engine…");
      // Module.run() is provided by blackops.js once the runtime is initialized.
      if (Module.calledRun) { Module.callMain(Module.arguments); }
      else { Module.onRuntimeInitialized = () => Module.callMain(Module.arguments); }
    }

    document.getElementById('pick').addEventListener('click', async () => {
      try {
        setStatus("select your Steam \"Call of Duty Black Ops\" folder…");
        // pickFolder() uses showDirectoryPicker() on a secure context (https/
        // localhost) and falls back to <input webkitdirectory> over plain HTTP/LAN.
        const n = await Module.KBFS.pickFolder();
        setStatus(`granted: ${n} files indexed. booting…`);
        startEngine();
      } catch (e) { console.error(e); setStatus("folder pick cancelled/failed: " + e.message); }
    });

    // Fake-file smoke FS: replaces KBFS with a tiny in-memory provider so the
    // sync bridge (open/size/pread/close + Asyncify) can be exercised end-to-end
    // without a real Steam install. It serves one zero-filled file of a chosen
    // size for ANY requested path, so you can confirm the read path round-trips.
    document.getElementById('fake').addEventListener('change', (ev) => {
      if (!ev.target.checked) return;
      const FAKE_SIZE = 64 * 1024; // 64 KB synthetic file
      Module.KBFS = {
        ready: true,
        _open: new Map(), _id: 1,
        exists() { return 1; },
        async open() { const id = this._id++; this._open.set(id, 0); return id; },
        async size() { return FAKE_SIZE; },
        async pread(id, offset, len) {
          const end = Math.min(offset + len, FAKE_SIZE);
          if (end <= offset) return new Uint8Array(0);
          return new Uint8Array(end - offset); // zero-filled
        },
        close(id) { this._open.delete(id); },
      };
      setStatus("fake-file smoke FS enabled. booting…");
      startEngine();
    });
  </script>
</body>
</html>
